name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore WhiteboxMetrix.sln

      - name: Validate benchmark manifests (all-uses + churn contracts)
        run: python3 scripts/validate_benchmark_manifests.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python churn classifications (pytest + coverage over scripts/)
        run: |
          python3 -m pip install --upgrade pip --quiet
          python3 -m pip install pytest pytest-cov --quiet
          cd scripts
          python3 -m pytest test_churn_helpers.py -v \
            --cov=churn_helpers \
            --cov=report_cobertura_summary \
            --cov=validate_benchmark_manifests \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Test (Coverlet MSBuild → TestResults/coverage/coverage.cobertura.xml)
        run: dotnet test WhiteboxMetrix.sln -c Release --no-restore -v minimal

      - name: Verify Cobertura exists (required for coverage delta)
        run: |
          set -euo pipefail
          f="TestResults/coverage/coverage.cobertura.xml"
          test -f "$f"
          echo "Cobertura: $f"
          python3 scripts/report_cobertura_summary.py "$f"

      - name: Upload Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: TestResults/coverage/coverage.cobertura.xml
          if-no-files-found: error
